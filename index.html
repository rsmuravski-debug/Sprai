<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор Обприскувача</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            font-size: 22px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .info-box {
            background-color: #e8f4fd;
            border-left: 4px solid #3498db;
            padding: 10px;
            font-size: 13px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #34495e;
            font-size: 16px;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }
        input[type="number"]:focus {
            border-color: #3498db;
        }
        button {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(46, 204, 113, 0.3);
        }
        button:active {
            background-color: #27ae60;
        }
        .results {
            margin-top: 25px;
        }
        .card {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
        }
        .best {
            background-color: #ebf9eb;
            border-left: 5px solid #2ecc71;
        }
        .second {
            background-color: #fef9e7;
            border-left: 5px solid #f1c40f;
        }
        .card-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .badge {
            font-size: 11px;
            padding: 3px 7px;
            border-radius: 10px;
            color: white;
        }
        .badge-best { background-color: #2ecc71; }
        .badge-second { background-color: #f1c40f; color: #333; }
        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 15px;
        }
        .data-label { color: #7f8c8d; }
        .data-value { font-weight: 600; color: #2c3e50; }
        .speed-highlight {
            font-size: 18px;
            color: #c0392b;
            font-weight: bold;
        }
        .error-message {
            color: #e74c3c;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }
        .area-calc-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #f8f9fa;
            border: 2px dashed #95a5a6;
            border-radius: 12px;
        }
        .area-title {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 16px;
            text-align: center;
        }
        .total-water-highlight {
            font-size: 22px;
            color: #2980b9;
            font-weight: bold;
            text-align: center;
            margin-top: 12px;
            background: #e1f5fe;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Розрахунок Обприскувача</h2>
    
    <div class="info-box">
        <strong>Конфігурація:</strong> Штанга 10м (20 форсунок, крок 50 см).
    </div>

    <div class="input-group">
        <label for="liters">Бажана норма виливу (л/га):</label>
        <input type="number" id="liters" placeholder="Наприклад: 150" min="1" max="500">
    </div>

    <button onclick="calculateSettings()">РОЗРАХУВАТИ РЕЖИМ</button>

    <div id="output" class="results"></div>
    
    <div id="areaBox" class="area-calc-box" style="display: none;">
        <div class="area-title">💧 Розрахунок води на площу поля</div>
        <div class="input-group" style="margin-bottom: 10px;">
            <label for="hectares" style="font-size: 14px; font-weight: normal;">Введіть площу поля (в гектарах):</label>
            <input type="number" id="hectares" placeholder="Наприклад: 4.5" min="0.1" step="0.1" oninput="calculateTotalWater()">
        </div>
        <div id="totalWaterResult" class="total-water-highlight">Потрібно води: 0 л</div>
    </div>
</div>

<script>
let currentNorma = 0;

function calculateSettings() {
    const inputField = document.getElementById('liters');
    const outputDiv = document.getElementById('output');
    const areaBox = document.getElementById('areaBox');
    
    outputDiv.innerHTML = '';
    areaBox.style.display = 'none';

    const normaTarget = parseFloat(inputField.value);
    if (!normaTarget || normaTarget <= 0) {
        outputDiv.innerHTML = '<div class="error-message">\u274c Будь ласка, введіть коректну кількість літрів!</div>';
        return;
    }

    currentNorma = normaTarget;
    const vidstan = 10.0 / 20; 
    const idealSpeed = 9.0; 

    const baseNozzles = {
        "ЖОВТІ": {"ref_p": 2.5, "ref_q": 0.775},
        "СИНІ":  {"ref_p": 2.5, "ref_q": 1.250}
    };

    let vsiVarianty = [];

    for (let color in baseNozzles) {
        const data = baseNozzles[color];
        
        for (let p_int = 15; p_int <= 45; p_int++) {
            let p_test = p_int / 10.0;
            let q_precise = data.ref_q * Math.sqrt(p_test / data.ref_p);
            let speedNeeded = (q_precise * 600) / (vidstan * normaTarget);
            let deviation = Math.abs(speedNeeded - idealSpeed);
            
            vsiVarianty.push({
                color: color,
                pressure: p_test,
                flow: q_precise,
                speed: speedNeeded,
                dev: deviation
            });
        }
    }

    vsiVarianty.sort((a, b) => a.dev - b.dev);

    // Відбираємо чітко ТОП-2 найкращих варіанти
    let recommended = [];
    vsiVarianty.forEach(v => {
        if (v.speed >= 4.5 && v.speed <= 15.0 && recommended.length < 2) {
            recommended.push(v);
        }
    });

    if (recommended.length === 0) {
        outputDiv.innerHTML = '<div class="error-message">\u26a0\ufe0f Не вдалося підібрати режими під швидкість 8-10 км/год. Спробуйте іншу норму виливу!</div>';
        return;
    }

    let htmlContent = '';
    recommended.forEach((v, index) => {
        let cardClass = index === 0 ? 'card best' : 'card second';
        let badgeClass = index === 0 ? 'badge badge-best' : 'badge badge-second';
        let badgeText = index === 0 ? '\u2b50 НАЙКРАЩИЙ РЕЖИМ' : '\ud83d\udc4d ДРУГИЙ ВАРІАНТ';

        htmlContent += `
            <div class="${cardClass}">
                <div class="card-title">
                    <span>${v.color} форсунки</span>
                    <span class="${badgeClass}">${badgeText}</span>
                </div>
                <div class="data-row">
                    <span class="data-label">Робочий тиск:</span>
                    <span class="data-value">${v.pressure.toFixed(1)} Legal бар</span>
                </div>
                <div class="data-row">
                    <span class="data-label">Точна витрата:</span>
                    <span class="data-value">${v.flow.toFixed(3)} л/хв</span>
                </div>
                <div class="data-row" style="margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 8px;">
                    <span class="data-label" style="color: #2c3e50; font-weight: bold;">ТРИМАТИ ШВИДКІСТЬ:</span>
                    <span class="data-value speed-highlight">${v.speed.toFixed(2)} км/год</span>
                </div>
            </div>
        `;
    });

    outputDiv.innerHTML = htmlContent;
    
    document.getElementById('hectares').value = '';
    document.getElementById('totalWaterResult').innerHTML = 'Потрібно води: 0 л';
    areaBox.style.display = 'block';
}

function calculateTotalWater() {
    const hectaresField = document.getElementById('hectares');
    const resultDiv = document.getElementById('totalWaterResult');
    const hectares = parseFloat(hectaresField.value);
    
    if (!hectares || hectares <= 0) {
        resultDiv.innerHTML = 'Потрібно води: 0 л';
        return;
    }
    
    const totalWater = hectares * currentNorma;
    resultDiv.innerHTML = `\ud83d\udca7 Потрібно води: ${totalWater.toFixed(0)} л`;
}
</script>

</body>
</html>
