<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Обприскувача</title>
    <style>
        body { font-family: system-ui; background: #f4f6f9; padding: 15px; color: #333; }
        .box { max-width: 480px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 8px; margin-top: 0; }
        .info { background: #e8f4fd; border-left: 4px solid #3498db; padding: 10px; font-size: 13px; border-radius: 4px; margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin: 10px 0 5px; font-size: 15px; }
        input { width: 100%; padding: 12px; font-size: 18px; border: 2px solid #bdc3c7; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; background: #2ecc71; color: #fff; border: none; padding: 14px; font-size: 18px; font-weight: bold; border-radius: 8px; margin: 15px 0; cursor: pointer; }
        .card { padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #e0e0e0; }
        .b1 { background: #ebf9eb; border-left: 5px solid #2ecc71; }
        .b2 { background: #fef9e7; border-left: 5px solid #f1c40f; }
        .row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 15px; }
        .val { font-weight: bold; color: #2c3e50; }
        .shv { font-size: 19px; color: #e67e22; font-weight: bold; }
        .tank { margin-top: 20px; padding: 15px; background: #f8f9fa; border: 2px dashed #3498db; border-radius: 12px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .tile { background: #fff; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #dcdde1; }
        .tl { font-size: 11px; color: #7f8c8d; font-weight: bold; text-transform: uppercase; }
        .tv { font-size: 19px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
<div class="box">
    <h2>Розрахунок Обприскувача</h2>
    <div class="info">Штанга 10м (20 форсунок). Розрахунок швидкості при тиску <b>НЕ БІЛЬШЕ 3.0 бар</b>.</div>
    
    <label>Бажана norma виливу (л/га):</label>
    <input type="number" id="liters" placeholder="Наприклад: 150">
    <button onclick="calc()">РОЗРАХУВАТИ ШВИДКІСТЬ</button>
    
    <div id="output"></div>
    
    <div id="tankBox" class="tank" style="display:none;">
        <div style="font-weight:bold; color:#2980b9; text-align:center;">📋 Заправка бака на площу</div>
        <div class="grid">
            <div><label style="font-size:13px;">Площа поля (га):</label><input type="number" id="ha" oninput="tank()" placeholder="0.0"></div>
            <div><label style="font-size:13px;">Препарат (л/га або кг/га):</label><input type="number" id="chem" oninput="tank()" placeholder="0.0"></div>
        </div>
        <div class="grid">
            <div class="tile"><div class="tl">Всього води</div><div id="voda" class="tv" style="color:#2980b9;">0 л</div></div>
            <div class="tile"><div class="tl">Всього хімії</div><div id="him" class="tv" style="color:#e67e22;">0 л/кг</div></div>
        </div>
    </div>
</div>

<script>
var curN = 0;
function calc() {
    var n = parseFloat(document.getElementById('liters').value);
    if (!n || n <= 0) { alert('Введіть літри!'); return; }
    curN = n;
    
    // Базові дані ISO: колір, номінальна витрата (л/хв) при 3.0 бар
    var nozzles = {
        "ЖОВТІ (02)": { qBase: 0.80, pBase: 3.0 },
        "СИНІ (03)": { qBase: 1.20, pBase: 3.0 }
    }; 
    
    var res = [];
    var minSpeed = 4.0;  // Мінімальна адекватна швидкість (км/год)
    var maxSpeed = 15.0; // Максимальна робоча швидкість (км/год)

    // Перебираємо форсунки
    for (var col in nozzles) {
        var f = nozzles[col];
        
        // Тестуємо два режими тиску: макс (3.0 бар) та оптимальний знижений (2.0 бар)
        // щоб дати агроному вибір по швидкості руху.
        var targetPressures = [3.0, 2.0]; 
        
        targetPressures.forEach(function(pTarget) {
            // Формула витрати форсунки залежно від тиску: q = qBase * sqrt(pTarget / pBase)
            var qCurrent = f.qBase * Math.sqrt(pTarget / f.pBase);
            
            // Формула швидкості: V = (600 * q) / (Q * B)
            var speed = (600 * qCurrent) / (n * 0.5);
            
            // Перевіряємо, чи швидкість реальна для трактора
            if (speed >= minSpeed && speed <= maxSpeed) {
                res.push({c: col, p: pTarget, q: qCurrent, v: speed});
            }
        });
    }
    
    // Сортуємо результати від вищого тиску до нижчого (щоб кращі варіанти були зверху)
    res.sort(function(a, b) { return b.p - a.p; });

    var html = '';
    if (res.length === 0) {
        html = '<div style="color:#e74c3c;font-weight:bold;text-align:center;padding:10px;">⚠️ При тиску до 3.0 бар не вдається підібрати робочу швидкість (4-15 км/год). Змініть норму виливу!</div>';
    } else {
        res.forEach(function(x, i){
            var cardClass = x.p === 3.0 ? 'card b1' : 'card b2';
            
            html += '<div class="'+cardClass+'">' +
                '<div class="row"><span style="font-weight:bold; color:#2c3e50;">' + x.c + '</span><span style="font-size:12px;font-weight:bold;color:#7f8c8d;">ТИСК: ' + x.p.toFixed(1) + ' БАР</span></div>' +
                '<div class="row"><span>Поточна витрата форсунки:</span><span class="val">' + x.q.toFixed(2) + ' л/хв</span></div>' +
                '<div class="row" style="margin-top:8px;border-top:1px dashed #ccc;padding-top:5px;"><span>НЕОБХІДНА ШВИДКІСТЬ:</span><span class="shv">' + x.v.toFixed(1) + ' км/год</span></div>' +
                '</div>';
        });
    }
    
    document.getElementById('output').innerHTML = html;
    document.getElementById('ha').value = ''; document.getElementById('chem').value = '';
    document.getElementById('voda').innerHTML = '0 л'; document.getElementById('him').innerHTML = '0 л/кг';
    document.getElementById('tankBox').style.display = 'block';
}

function tank() {
    var h = parseFloat(document.getElementById('ha').value), c = parseFloat(document.getElementById('chem').value);
    if (h && h > 0) {
        document.getElementById('voda').innerHTML = (h * curN).toFixed(0) + ' л';
        document.getElementById('him').innerHTML = c && c > 0 ? (h * c).toFixed(2) + ' л/кг' : '0 л/кг';
    } else {
        document.getElementById('voda').innerHTML = '0 л'; document.getElementById('him').innerHTML = '0 л/кг';
    }
}
</script>
</body>
</html>
