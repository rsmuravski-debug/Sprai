<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Обприскувача</title>
    <style>
        body { font-family: system-ui; background: #f4f6f9; padding: 15px; color: #333; }
        .box { max-width: 480px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 8px; margin-top: 0; }
        label { display: block; font-weight: bold; margin: 15px 0 5px; font-size: 15px; }
        select, input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 8px; box-sizing: border-box; background: #fff; }
        select { cursor: pointer; }
        button { width: 100%; background: #2ecc71; color: #fff; border: none; padding: 14px; font-size: 18px; font-weight: bold; border-radius: 8px; margin: 20px 0 15px; cursor: pointer; }
        button:hover { background: #27ae60; }
        .card { padding: 20px; border-radius: 10px; margin-top: 15px; text-align: center; }
        .b-yellow { background: #fffde7; border: 2px solid #f1c40f; }
        .b-blue { background: #eef7fe; border: 2px solid #3498db; }
        .res-title { font-size: 16px; color: #7f8c8d; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; }
        .res-bar { font-size: 32px; font-weight: bold; color: #e67e22; margin: 10px 0; }
        .res-info { font-size: 14px; color: #34495e; line-height: 1.5; }
        .tank { margin-top: 25px; padding: 15px; background: #f8f9fa; border: 2px dashed #3498db; border-radius: 12px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .tile { background: #fff; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #dcdde1; }
        .tl { font-size: 11px; color: #7f8c8d; font-weight: bold; text-transform: uppercase; }
        .tv { font-size: 19px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
<div class="box">
    <h2>Розрахунок Тиску</h2>
    
    <label>1. Оберіть колір форсунок:</label>
    <select id="nozzleType">
        <option value="yellow">ЖОВТІ (Ваші заміри)</option>
        <option value="blue">СИНІ (Ваші заміри)</option>
    </select>

    <label>2. Планована швидкість (км/год):</label>
    <input type="number" id="speed" step="0.1" placeholder="Наприклад: 8.5">

    <label>3. Бажана норма виливу (л/га):</label>
    <input type="number" id="liters" placeholder="Наприклад: 150">

    <button onclick="calcPressure()">РОЗРАХУВАТИ БАРИ</button>
    
    <div id="output"></div>
    
    <div id="tankBox" class="tank" style="display:none;">
        <div style="font-weight:bold; color:#2980b9; text-align:center;">📋 Заправка бака на площу</div>
        <div class="grid">
            <div><label style="font-size:13px; margin: 5px 0;">Площа поля (га):</label><input type="number" id="ha" oninput="tank()" placeholder="0.0"></div>
            <div><label style="font-size:13px; margin: 5px 0;">Препарат (л або кг/га):</label><input type="number" id="chem" oninput="tank()" placeholder="0.0"></div>
        </div>
        <div class="grid">
            <div class="tile"><div class="tl">Всього води</div><div id="voda" class="tv" style="color:#2980b9;">0 л</div></div>
            <div class="tile"><div class="tl">Всього хімії</div><div id="him" class="tv" style="color:#e67e22;">0 л/кг</div></div>
        </div>
    </div>
</div>

<script>
var curN = 0;

function calcPressure() {
    var type = document.getElementById('nozzleType').value;
    var v = parseFloat(document.getElementById('speed').value);
    var n = parseFloat(document.getElementById('liters').value);
    
    if (!v || v <= 0) { alert('Введіть швидкість руху!'); return; }
    if (!n || n <= 0) { alert('Введіть норму виливу!'); return; }
    
    curN = n;
    var spacing = 0.5; // Відстань між форсунками 50 см
    
    // Формула: яка потрібна витрата з однієї форсунки (л/хв) під цю швидкість і норму
    var qNeeded = (n * v * spacing) / 600;
    
    // Твої опорні точки (базовий тиск та фактичний вилив при ньому)
    var baseP = 3.0;
    var baseQ = (type === 'yellow') ? 0.875 : 1.350; 
    
    // Квадратична залежність для пошуку точного тиску: P = 3.0 * (qNeeded / baseQ)^2
    var targetBar = baseP * Math.pow((qNeeded / baseQ), 2);
    
    var html = '';
    var cardClass = (type === 'yellow') ? 'card b-yellow' : 'card b-blue';
    var nozzleName = (type === 'yellow') ? 'ЖОВТИХ' : 'СИНІХ';

    if (targetBar > 3.0) {
        html = '<div style="color:#e74c3c;font-weight:bold;text-align:center;padding:10px;border: 2px dashed #e74c3c;border-radius:10px;background:#fdf2f2;">⚠️ Необхідний тиск (' + targetBar.toFixed(2) + ' бар) ПЕРЕВИЩУЄ максимальні 3.0 бар!<br><small style="font-weight:normal;color:#555;">Щоб знизити тиск: зменшіть швидкість або скиньте норму виливу.</small></div>';
    } else if (targetBar < 1.2) {
        html = '<div style="color:#c0392b;font-weight:bold;text-align:center;padding:10px;border: 2px dashed #c0392b;border-radius:10px;background:#fdf2f2;">⚠️ Тиск занадто низький (' + targetBar.toFixed(2) + ' бар). Флакел розпилу буде нестабільним.<br><small style="font-weight:normal;color:#555;">Щоб підняти тиск: збільшіть швидкість руху або норму виливу.</small></div>';
    } else {
        html = '<div class="' + cardClass + '">' +
            '<div class="res-title">Необхідний тиск для ' + nozzleName + ' форсунок</div>' +
            '<div class="res-bar">' + targetBar.toFixed(2) + ' бар</div>' +
            '<div class="res-info">' +
                'Потрібна витрата рідини: <b>' + qNeeded.toFixed(3) + ' л/хв</b> на форсунку.<br>' +
                'При швидкості <b>' + v.toFixed(1) + ' км/год</b> та нормі <b>' + n + ' л/га</b>.' +
            '</div>' +
            '</div>';
    }
    
    document.getElementById('output').innerHTML = html;
    document.getElementById('ha').value = ''; document.getElementById('chem').value = '';
    document.getElementById('voda').innerHTML = '0 л'; document.getElementById('him').innerHTML = '0 л/кг';
    document.getElementById('tankBox').style.display = 'block';
}

function tank() {
    var h = parseFloat(document.getElementById('ha').value), c = parseFloat(document.getElementById('chem').value);
    if (h && h > 0) {
        document.getElementById('voda').innerHTML = (h * curN).toFixed(0) + ' л';
        document.getElementById('him').innerHTML = c && c > 0 ? (h * c).toFixed(2) + ' л/кг' : '0 л/кг';
    } else {
        document.getElementById('voda').innerHTML = '0 л'; document.getElementById('him').innerHTML = '0 л/кг';
    }
}
</script>
</body>
</html>
